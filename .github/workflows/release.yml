name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # 只在 GitHub 上运行；Gitea 读取 main 时会回退到本目录，需跳过
    if: github.server_url == 'https://github.com'
    name: GitHub Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # 完整历史，用于生成 changelog

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG, Version: $VERSION"

      - name: Check if release version (no pre-release suffix)
        id: is_release
        run: |
          if [[ "${{ steps.version.outputs.tag }}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        id: changelog
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          # 预览版与上一个任意版本比较，正式版与上一个正式版比较，见 scripts/release-notes.sh
          {
            echo "changelog<<EOF"
            if [[ -f "doc/releases/$RELEASE_TAG.md" ]]; then
              cat "doc/releases/$RELEASE_TAG.md"
            else
              bash scripts/release-notes.sh "$RELEASE_TAG"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            ${{ steps.changelog.outputs.changelog }}

            [Code signing policy](https://github.com/${{ github.repository }}/blob/main/doc/CODE_SIGNING.en.md) · [Privacy policy](https://github.com/${{ github.repository }}/blob/main/doc/PRIVACY.en.md)
          prerelease: ${{ steps.is_release.outputs.prerelease == 'true' }}
          generate_release_notes: false
